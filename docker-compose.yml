services:
  trading-agent:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    image: alpha-client-v3:local
    container_name: alpha-client-v3
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - HEALTH_PORT=5000
      - CLIENT_ID=${CLIENT_ID:-}
      - CLIENT_NAME=${CLIENT_NAME:-Alpha Autonomous Client v3}
      - SIM_PIPELINE_URL=${SIM_PIPELINE_URL:-http://localhost:4000/api/pipeline/alpha-bundle}
      - SIM_TELEMETRY_URL=${SIM_TELEMETRY_URL:-http://localhost:4000/api/pipeline/telemetry}
      - SIM_PIPELINE_FALLBACK_URL=${SIM_PIPELINE_FALLBACK_URL:-}
      - SIM_TELEMETRY_FALLBACK_URL=${SIM_TELEMETRY_FALLBACK_URL:-}
      - SIMLAB_SERVER_URL=${SIMLAB_SERVER_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      # Port 5050 eliminates macOS AirPlay/ControlCenter port 5000 collision
      - "5050:5000"
    volumes:
      - ./src:/app/src
      - ./dashboard:/app/dashboard
      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:5050/health || curl -fs http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
