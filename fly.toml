# fly.toml app configuration file generated for alpha-autonomouse-v3 on 2026-11-24T14:08:30Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'alpha-autonomouse-v3'
primary_region = 'ams'

[build]
[processes]
  app = 'node ./dbsetup.js npm run dev'

[[mounts]]
  source = 'data'
  destination = '/data'
  auto_extend_size_threshold = 80
  auto_extend_size_increment = '1GB'
  auto_extend_size_limit = '10GB'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
